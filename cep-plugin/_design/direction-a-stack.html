<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCP Bridge — Direction A (Priority Stack)</title>
<style>
/* ============================================================
   DIRECTION A — PRIORITY STACK
   One column, ordered strictly by "what do I need to know first".
   Reflows to two columns >=600px. Config + log are disclosures.
   Tokens are host-derived at runtime (appSkinInfo) with the
   validated dark fallback below.
   ============================================================ */
:root{
  /* surface family — OVERWRITTEN by applyHostTheme() */
  --surface:#1a1a19;
  --surface-2:#232322;
  --surface-3:#2c2c2a;
  --hairline:#2c2c2a;
  --baseline:#383835;
  --ink-1:#ffffff;
  --ink-2:#c3c2b7;
  --ink-3:#898781;

  /* series hue — validated single-series slot, never themed */
  --series:#3987e5;
  --series-track:#184f95;
  --accent-fill:#256abf;   /* primary button fill, white text 5.39:1 */

  /* status palette — FIXED, never themed */
  --good:#0ca30c;
  --warning:#fab219;
  --serious:#ec835a;
  --critical:#d03b3b;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{
  background:var(--surface);
  color:var(--ink-1);
  font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.panel{padding:10px 12px 16px}

/* ---------- dev-only state switcher ---------- */
.devbar{
  display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;
  border-bottom:1px solid var(--hairline);background:var(--surface-2);
}
.devbar b{font:600 10px/18px system-ui;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-right:4px}
.devbar a{
  font:500 10px/1 system-ui;color:var(--ink-2);text-decoration:none;
  padding:5px 7px;border:1px solid var(--hairline);border-radius:4px;
}
.devbar a[aria-current="true"]{color:var(--ink-1);border-color:var(--baseline);background:var(--surface-3)}
body.bare .devbar{display:none}

/* ---------- identity: ONE line ---------- */
.idline{
  display:flex;align-items:baseline;gap:6px;
  font-size:11px;color:var(--ink-3);padding-bottom:8px;
}
.idline strong{color:var(--ink-2);font-weight:600}
.idline .spacer{flex:1 1 auto}

/* ---------- hero status ---------- */
.hero{
  display:flex;gap:9px;align-items:flex-start;
  padding:11px 12px 11px 11px;border-radius:5px;
  background:var(--surface-2);
  border-left:3px solid var(--baseline);
}
.hero.lv-good{border-left-color:var(--good)}
.hero.lv-warning{border-left-color:var(--warning)}
.hero.lv-serious{border-left-color:var(--serious)}
.hero.lv-critical{border-left-color:var(--critical)}
.hero-ico{flex:0 0 auto;margin-top:2px}
.ico{width:15px;height:15px;display:block}
.lv-good .hero-ico,.ic-good{color:var(--good)}
.lv-warning .hero-ico,.ic-warning{color:var(--warning)}
.lv-serious .hero-ico,.ic-serious{color:var(--serious)}
.lv-critical .hero-ico,.ic-critical{color:var(--critical)}
.lv-off .hero-ico,.ic-off,.lv-pending .hero-ico,.ic-pending{color:var(--ink-3)}
.hero-body{min-width:0;flex:1 1 auto}
#connectionText{
  display:block;font-size:16px;line-height:1.2;font-weight:650;
  color:var(--ink-1);letter-spacing:-.01em;
}
.hero-sub{
  display:flex;align-items:center;gap:5px;margin-top:5px;
  font-size:11.5px;color:var(--ink-2);
}
.hero-sub .ico{width:11px;height:11px}
#serverText{min-width:0;overflow-wrap:anywhere}
.nowline{
  margin-top:8px;padding-top:8px;border-top:1px solid var(--hairline);
  font-size:11.5px;color:var(--ink-2);
}
.nowline .cmd{
  color:var(--ink-1);font-weight:600;
  font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;
}
.nowline[hidden]{display:none}

/* running dots (reduced-motion safe) */
.dots::after{content:"";animation:dots 1.4s steps(4,end) infinite;}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.dots::after{content:"…";animation:none}}
.spin{animation:spin 1.1s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* ---------- the ONE primary action ---------- */
.act{margin-top:10px;display:flex;flex-direction:column;gap:7px}
button{
  font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
  border-radius:4px;padding:11px 12px;cursor:pointer;
  border:1px solid var(--baseline);background:var(--surface-3);color:var(--ink-1);
  width:100%;text-align:center;
}
button:focus-visible{outline:2px solid var(--series);outline-offset:2px}
button.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
button.danger{background:var(--surface-3);border-color:var(--baseline);color:var(--ink-1)}
/* THE CONTRACT TRICK: the live bridge already sets
   startButton.disabled = isConnected and stopButton.disabled = !isConnected,
   so hiding the disabled one yields exactly ONE primary control, no JS change. */
#startButton:disabled,#stopButton:disabled{display:none}
#bridgeBusy{opacity:.75;cursor:default;display:flex;align-items:center;justify-content:center;gap:7px}
#bridgeBusy[hidden]{display:none}
.act-row{display:flex;gap:7px}
.act-row button{width:auto;flex:1 1 0;padding:8px 10px;font-size:11.5px;font-weight:500;color:var(--ink-2);background:none;border-color:var(--hairline)}

/* ---------- KPI row ---------- */
h2{
  margin:16px 0 7px;font:600 10px/1 system-ui;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);
}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.tile{
  background:var(--surface-2);border-radius:5px;padding:9px 10px;min-width:0;
}
.tile-label{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-value{
  display:block;margin-top:3px;font-size:21px;line-height:1.05;font-weight:600;
  color:var(--ink-1);letter-spacing:-.02em;overflow-wrap:anywhere;
}
.tile-value .u{font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.tile-delta{
  display:flex;align-items:center;gap:4px;margin-top:4px;
  font-size:10.5px;color:var(--ink-2);
}
.tile-delta .ico{width:9px;height:9px;flex:0 0 auto}
.tile-delta.up-good{color:var(--good)}
.tile-delta.bad{color:var(--critical)}
.tile-spark{margin-top:6px;display:block;height:26px;width:100%}
.tile-spark[hidden]{display:none}

/* ---------- meter ---------- */
.meterwrap{background:var(--surface-2);border-radius:5px;padding:9px 10px}
.meter-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:10.5px;color:var(--ink-3)}
.meter-head b{color:var(--ink-1);font-size:12px;font-variant-numeric:tabular-nums}
.meter-track{
  position:relative;height:8px;border-radius:2px;margin-top:7px;
  background:var(--series-track);overflow:hidden;
}
/* no data: a neutral track, never a full blue bar that reads as 100% */
.meter-track.empty{background:var(--baseline)}
.meter-track.empty .meter-tick{display:none}
.meter-fill{
  height:100%;background:var(--series);
  border-right:2px solid var(--surface-2); /* the 2px surface gap */
  border-radius:2px 0 0 2px;
}
.meter-fill.sev-warning{background:var(--warning)}
.meter-fill.sev-critical{background:var(--critical)}
.meter-tick{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--ink-2)}
.meter-foot{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:10.5px;color:var(--ink-2)}
.meter-foot .ico{width:10px;height:10px}

/* ---------- disclosures (config, log) ---------- */
details{
  margin-top:9px;border:1px solid var(--hairline);border-radius:5px;background:var(--surface-2);
}
details>summary{
  cursor:pointer;list-style:none;padding:9px 10px;display:flex;gap:7px;align-items:center;
  font-size:11.5px;color:var(--ink-2);
}
details>summary::-webkit-details-marker{display:none}
summary .chev{width:9px;height:9px;color:var(--ink-3);flex:0 0 auto;transition:transform .12s}
@media (prefers-reduced-motion:reduce){summary .chev{transition:none}}
details[open] summary .chev{transform:rotate(90deg)}
details>summary>span:not(.sum-val){white-space:nowrap;flex:0 0 auto}
summary .sum-val{
  margin-left:auto;color:var(--ink-3);font-size:10.5px;
  flex:0 1 auto;min-width:0;max-width:56%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;
}
summary.needs{color:var(--ink-1)}
.dbody{padding:0 10px 10px}
label{display:block;font-size:10.5px;color:var(--ink-3);margin-bottom:5px}
input[type=text]{
  width:100%;padding:8px 9px;border-radius:4px;border:1px solid var(--baseline);
  background:var(--surface);color:var(--ink-1);font:12px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;
}
input[type=text]:focus{outline:none;border-color:var(--series)}
.hintrow{display:flex;gap:7px;margin-top:8px}
.hintrow button{width:auto;flex:0 0 auto;padding:8px 12px;font-size:11.5px}
.help{font-size:10.5px;color:var(--ink-3);margin-top:7px}

/* ---------- callout (last error) ---------- */
.callout{
  display:flex;gap:7px;margin-top:9px;padding:9px 10px;border-radius:5px;
  background:var(--surface-2);border-left:3px solid var(--critical);font-size:11.5px;color:var(--ink-2);
}
.callout[hidden]{display:none}
.callout .ico{width:12px;height:12px;flex:0 0 auto;margin-top:1px;color:var(--critical)}
.callout b{display:block;color:var(--ink-1);font-weight:600;margin-bottom:2px}
.callout code{font:11px/1.4 ui-monospace,Menlo,monospace;overflow-wrap:anywhere}

/* ---------- history rows (LIVE MARKUP CONTRACT) ----------
   bridge-cep.js emits:
   #commandQueue > .command-item > .command-label + .command-status.{pending|executing|completed}
   so this is styling only — the port is CSS, not JS.               */
#commandQueue{border:1px solid var(--hairline);border-radius:5px;overflow:hidden}
.command-item{
  display:flex;align-items:center;gap:8px;padding:7px 9px;
  border-top:1px solid var(--hairline);background:var(--surface-2);
}
.command-item:first-child{border-top:0}
.command-label{
  flex:1 1 auto;min-width:0;font-size:11.5px;color:var(--ink-1);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.command-ms{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:0 0 auto}
.command-status{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
  font:600 9.5px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
}
.command-status::before{content:"";width:8px;height:8px;flex:0 0 auto;background:currentColor}
.command-status.completed{color:var(--good)}
.command-status.completed::before{border-radius:50%}
.command-status.executing{color:var(--ink-1)}
.command-status.executing::before{border-radius:50%;background:none;box-shadow:inset 0 0 0 1.5px currentColor}
.command-status.pending{color:var(--ink-3)}
.command-status.pending::before{border-radius:50%;background:none;box-shadow:inset 0 0 0 1.5px currentColor}
.command-status.failed{color:var(--critical)}
.command-status.failed::before{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}

/* ---------- log (LIVE MARKUP CONTRACT: .log-entry.{info|warning|error}) ---------- */
#logContainer{max-height:150px;overflow-y:auto;border-radius:4px;background:var(--surface)}
.log-entry{
  font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
  padding:5px 8px;color:var(--ink-2);border-left:2px solid var(--baseline);
  overflow-wrap:anywhere;margin-bottom:3px;
}
.log-entry.warning{border-left-color:var(--warning);color:var(--ink-1)}
.log-entry.error{border-left-color:var(--critical);color:var(--ink-1)}

/* ---------- two columns when there is room ---------- */
@media (min-width:600px){
  .panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;align-items:start}
  .colspan{grid-column:1/-1}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .col-a{grid-column:1}
  .col-b{grid-column:2}
  .col-b>h2:first-child{margin-top:16px}
}
</style>
</head>
<body>

<!-- icon sprite: shape carries status alongside color + text label -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-good" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="currentColor"/></symbol>
  <symbol id="i-off" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.4" fill="none" stroke="currentColor" stroke-width="1.9"/></symbol>
  <symbol id="i-pending" viewBox="0 0 16 16"><circle class="spin" cx="8" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-dasharray="11 7" stroke-linecap="round"/></symbol>
  <symbol id="i-warning" viewBox="0 0 16 16"><path d="M8 1.9 15.2 14.4H.8Z" fill="currentColor"/></symbol>
  <symbol id="i-serious" viewBox="0 0 16 16"><path d="M8 1.2 14.8 8 8 14.8 1.2 8Z" fill="currentColor"/></symbol>
  <symbol id="i-critical" viewBox="0 0 16 16"><path d="M3.4 4.8 4.8 3.4 12.6 11.2l-1.4 1.4Z M11.2 3.4l1.4 1.4-7.8 7.8-1.4-1.4Z" fill="currentColor"/></symbol>
  <symbol id="i-up" viewBox="0 0 10 10"><path d="M5 1 9.5 8.5H.5Z" fill="currentColor"/></symbol>
  <symbol id="i-down" viewBox="0 0 10 10"><path d="M5 9 .5 1.5h9Z" fill="currentColor"/></symbol>
  <symbol id="i-flat" viewBox="0 0 10 10"><rect x="1" y="4.2" width="8" height="1.6" fill="currentColor"/></symbol>
  <symbol id="i-chev" viewBox="0 0 10 10"><path d="M3 1 8 5l-5 4Z" fill="currentColor"/></symbol>
</defs></svg>

<nav class="devbar" id="devbar"><b>State</b></nav>

<main class="panel">

  <!-- 6. identity: one line, never a hero card -->
  <div class="idline colspan">
    <strong>MCP Bridge</strong><span>CEP</span><span class="spacer"></span><span>v1.2.0</span>
  </div>

  <div class="col-a">
    <!-- 1. IS IT ALIVE -->
    <section class="hero lv-off" id="heroBlock" aria-live="polite">
      <span class="hero-ico"><svg class="ico" id="heroIcon"><use href="#i-off"></use></svg></span>
      <div class="hero-body">
        <span id="connectionText">Disconnected</span>
        <div class="hero-sub">
          <svg class="ico" id="serverIcon"><use href="#i-off"></use></svg>
          <span id="serverText">Start Bridge to enable</span>
        </div>
        <div class="nowline" id="nowLine" hidden>
          Running <span class="cmd" id="nowCmd">—</span> · <span id="nowElapsed">0.0s</span>
        </div>
      </div>
      <!-- kept for the live contract; the dot is redundant here so it is visually hidden -->
      <span id="connectionStatus" hidden></span><span id="serverStatus" hidden></span>
    </section>

    <!-- 3. ONE primary control -->
    <div class="act">
      <button class="primary" id="startButton" onclick="startBridge()">Start Bridge</button>
      <button class="danger" id="stopButton" onclick="stopBridge()" disabled>Stop Bridge</button>
      <button id="bridgeBusy" hidden disabled><svg class="ico" style="width:13px;height:13px"><use href="#i-pending"></use></svg><span class="dots">Starting bridge</span></button>
      <div class="act-row">
        <button id="diagnosticsButton" onclick="runDiagnostics()">Run diagnostics</button>
        <button id="clearButton" onclick="clearLog()">Clear log</button>
      </div>
    </div>

    <div class="callout" id="errorCallout" hidden>
      <svg class="ico"><use href="#i-critical"></use></svg>
      <div><b id="errorTitle">Last error</b><code id="errorBody">—</code></div>
    </div>

    <!-- 2. TELEMETRY -->
    <h2>Telemetry</h2>
    <div class="kpis" id="kpis"></div>

    <h2>Round-trip vs timeout budget</h2>
    <div class="meterwrap">
      <div class="meter-head"><span>Last round-trip</span><b id="meterValue">—</b></div>
      <div class="meter-track"><div class="meter-fill" id="meterFill" style="width:0%"></div><div class="meter-tick" id="meterTick" style="left:75%"></div></div>
      <div class="meter-foot"><svg class="ico" id="meterIcon"><use href="#i-off"></use></svg><span id="meterLabel">No traffic yet · budget 8.0s</span></div>
    </div>

    <!-- 4. CONFIG — recessive, promotes itself when unset -->
    <details id="configBlock">
      <summary id="configSummary"><svg class="chev"><use href="#i-chev"></use></svg><span>Temp directory</span><span class="sum-val" id="configPeek">—</span></summary>
      <div class="dbody">
        <label for="tempDirectory">Must match PREMIERE_TEMP_DIR in your MCP client</label>
        <input type="text" id="tempDirectory" placeholder="/tmp/premiere-mcp-bridge">
        <div class="hintrow"><button onclick="saveConfig()">Save</button></div>
        <p class="help">Set once per machine. Changing it needs a bridge restart.</p>
      </div>
    </details>
  </div>

  <div class="col-b">
    <!-- 5. HISTORY -->
    <h2>Recent commands</h2>
    <div id="commandQueue" role="table" aria-label="Recent commands"></div>
    <details id="logBlock">
      <summary><svg class="chev"><use href="#i-chev"></use></svg><span>Activity log</span><span class="sum-val" id="logPeek">—</span></summary>
      <div class="dbody"><div id="logContainer"></div></div>
    </details>
  </div>
</main>

<script>
/* ============================================================
   HOST THEME DERIVATION
   Premiere exposes its own panel background through CSInterface.
   Derive the whole surface + ink family from it so the panel
   matches all four user brightness settings. Falls back to the
   validated dark surface #1a1a19 outside Premiere.
   ============================================================ */
function clamp8(n){return Math.max(0,Math.min(255,Math.round(n)))}
function toHex(r,g,b){return '#'+[r,g,b].map(function(v){return clamp8(v).toString(16).padStart(2,'0')}).join('')}
function lum(r,g,b){
  var a=[r,g,b].map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});
  return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];
}
function mix(r,g,b,tr,tg,tb,t){return toHex(r+(tr-r)*t,g+(tg-g)*t,b+(tb-b)*t)}
function applyHostTheme(){
  var r=26,g=26,b=25; /* validated dark fallback #1a1a19 */
  try{
    if(typeof CSInterface==='function'){
      var c=new CSInterface().hostEnvironment.appSkinInfo.panelBackgroundColor.color;
      r=c.red;g=c.green;b=c.blue;
    }
  }catch(e){}
  var dark=lum(r,g,b)<0.35, s=document.documentElement.style;
  var tr=dark?255:0, tg=dark?255:0, tb=dark?255:0;
  s.setProperty('--surface',toHex(r,g,b));
  s.setProperty('--surface-2',mix(r,g,b,tr,tg,tb,dark?0.045:0.035));
  s.setProperty('--surface-3',mix(r,g,b,tr,tg,tb,dark?0.095:0.075));
  s.setProperty('--hairline', mix(r,g,b,tr,tg,tb,dark?0.09:0.12));
  s.setProperty('--baseline', mix(r,g,b,tr,tg,tb,dark?0.16:0.22));
  s.setProperty('--ink-1',dark?'#ffffff':'#0b0b0b');
  s.setProperty('--ink-2',dark?'#c3c2b7':'#52514e');
  s.setProperty('--ink-3',dark?'#898781':'#6f6e69');
  /* light Premiere themes: #2a78d6 only reaches 2.23:1 on the lightest panel gray (#b8b8b8),
     so the series steps down to #1c5cab (validated PASS) and the meter track becomes the
     LIGHTER step #2a78d6 so the ordinal ramp still reads more-is-darker. */
  if(!dark){s.setProperty('--series','#1c5cab');s.setProperty('--series-track','#2a78d6')}
}
applyHostTheme();

/* ============================================================
   MOCK DATA + STATES  (mockup only — the live panel gets these
   from bridge-cep.js)
   ============================================================ */
var LAT=[142,138,151,133,147,162,140,129,155,148,136,144];
var QUE=[0,0,1,0,2,3,3,2,1,0,1,0];
var ERRS=[0,0,0,1,0,0,0,2,1,0,0,1];

var HIST_OK=[
  ['add_to_timeline','completed','412'],
  ['set_clip_scale','completed','188'],
  ['get_full_sequence_info','completed','96'],
  ['create_bin','completed','133'],
  ['list_sequences','completed','74'],
  ['bake_keyframe_ease','completed','655']
];
var HIST_BUSY=[
  ['export_sequence','executing','2140'],
  ['add_transition','pending','—'],
  ['set_clip_opacity','pending','—'],
  ['add_to_timeline','completed','412'],
  ['set_clip_scale','completed','188'],
  ['get_full_sequence_info','completed','96']
];
var HIST_ERR=[
  ['apply_effect','failed','8004'],
  ['list_available_effects','completed','221'],
  ['add_to_timeline','completed','412'],
  ['set_clip_scale','completed','188'],
  ['get_full_sequence_info','completed','96']
];
var LOG_OK=[
  ['info','Bridge started · polling /tmp/premiere-mcp-bridge every 250ms'],
  ['info','Premiere Pro 26.3.1 · project feature_cut.prproj'],
  ['info','add_to_timeline verified:true (412ms)']
];
var LOG_ERR=[
  ['error','apply_effect failed: QE effect add rejected by host (8004ms, timeout 8000ms)'],
  ['warning','Retry 1 of 1 for apply_effect'],
  ['info','list_available_effects verified:true (221ms)']
];

var STATES={
  'disconnected':{
    level:'off', icon:'i-off', title:'Bridge stopped',
    server:{icon:'i-off',text:'Premiere: not polled while stopped'},
    control:'start', temp:'/tmp/premiere-mcp-bridge',
    tiles:[
      {l:'Queue depth',v:'—',spark:null},
      {l:'Round-trip',v:'—',spark:null},
      {l:'Uptime',v:'—',spark:null},
      {l:'Errors (session)',v:'—',spark:null}
    ],
    meter:null, hist:[], log:[['info','Panel loaded. Bridge not started.']]
  },

/* ---------- sparkline: 2px line, single series hue, 8px end marker with 2px surface ring ---------- */
function sparkline(vals){
  var w=120,h=26,p=7,min=Math.min.apply(null,vals),max=Math.max.apply(null,vals),r=(max-min)||1;
  var pts=vals.map(function(v,i){
    return [p+i*(w-2*p)/(vals.length-1), h-p-((v-min)/r)*(h-2*p)];
  });
  var d=pts.map(function(pt,i){return (i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1)}).join(' ');
  var last=pts[pts.length-1];
  return '<svg class="tile-spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'
    +'<path d="'+d+'" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
    +'<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4" fill="var(--series)" stroke="var(--surface-2)" stroke-width="2"/>'
    +'</svg>';
}
function deltaHTML(d){
  if(!d)return '';
  var ic=d.dir==='up'?'i-up':d.dir==='down'?'i-down':'i-flat';
  var cls=d.good?' up-good':d.bad?' bad':'';
  return '<span class="tile-delta'+cls+'"><svg class="ico"><use href="#'+ic+'"></use></svg><span>'+d.t+'</span></span>';
}

function render(key){
  var s=STATES[key]||STATES['disconnected'];
  document.title='MCP Bridge — A — '+key;

  var hero=document.getElementById('heroBlock');
  hero.className='hero lv-'+s.level;
  document.getElementById('heroIcon').innerHTML='<use href="#'+s.icon+'"></use>';
  document.getElementById('connectionText').textContent=s.title;
  document.getElementById('serverIcon').innerHTML='<use href="#'+s.server.icon+'"></use>';
  document.getElementById('serverText').textContent=s.server.text;

  var nl=document.getElementById('nowLine');
  if(s.now){nl.hidden=false;document.getElementById('nowCmd').textContent=s.now.cmd;document.getElementById('nowElapsed').textContent=s.now.elapsed}
  else nl.hidden=true;

  /* one primary control, driven by the SAME disabled flags the live bridge sets */
  var start=document.getElementById('startButton'),stop=document.getElementById('stopButton'),busy=document.getElementById('bridgeBusy');
  start.disabled=(s.control!=='start'&&s.control!=='config');
  stop.disabled=(s.control!=='stop');
  busy.hidden=(s.control!=='busy');
  start.textContent = s.control==='config' ? 'Set temp directory to start' : 'Start Bridge';
  start.className = 'primary';

  var ec=document.getElementById('errorCallout');
  if(s.error){ec.hidden=false;document.getElementById('errorTitle').textContent=s.error.title;document.getElementById('errorBody').textContent=s.error.body}
  else ec.hidden=true;

  document.getElementById('kpis').innerHTML=s.tiles.map(function(t){
    return '<div class="tile"><div class="tile-label">'+t.l+'</div>'
      +'<span class="tile-value">'+t.v+(t.u?' <span class="u">'+t.u+'</span>':'')+'</span>'
      +deltaHTML(t.delta)
      +(t.spark?sparkline(t.spark):'')
      +'</div>';
  }).join('');

  var mf=document.getElementById('meterFill'),mv=document.getElementById('meterValue'),
      ml=document.getElementById('meterLabel'),mi=document.getElementById('meterIcon');
  if(s.meter){
    var pct=Math.min(100,s.meter.ms/s.meter.budget*100);
    var sev=pct>=100?'critical':pct>=60?'warning':'';
    mf.style.width=Math.max(3,pct)+'%';
    mf.className='meter-fill'+(sev?' sev-'+sev:'');
    mf.parentNode.className='meter-track';
    mv.textContent=(s.meter.ms/1000).toFixed(2)+' s';
    mi.innerHTML='<use href="#'+(sev==='critical'?'i-critical':sev==='warning'?'i-warning':'i-good')+'"></use>';
    mi.className='ico '+(sev==='critical'?'ic-critical':sev==='warning'?'ic-warning':'ic-good');
    ml.textContent=(sev==='critical'?'Over the 8.0 s budget':sev==='warning'?'Approaching the 8.0 s budget':'Within the 8.0 s budget')
      +' · '+Math.round(pct)+'% used';
  }else{
    mf.style.width='0%';mf.className='meter-fill';mf.parentNode.className='meter-track empty';mv.textContent='—';
    mi.innerHTML='<use href="#i-off"></use>';mi.className='ico ic-off';
    ml.textContent='No traffic yet · budget 8.0 s';
  }

  var cq=document.getElementById('commandQueue');
  cq.innerHTML = s.hist.length
    ? s.hist.map(function(h){
        return '<div class="command-item" role="row"><span class="command-label">'+h[0]+'</span>'
          +'<span class="command-ms">'+h[2]+(h[2]==='—'?'':' ms')+'</span>'
          +'<span class="command-status '+h[1]+'">'+h[1]+'</span></div>';
      }).join('')
    : '<div class="command-item"><span class="command-label">No commands in queue</span></div>';

  document.getElementById('logContainer').innerHTML=s.log.map(function(l){
    return '<div class="log-entry '+l[0]+'">[2026-08-25T14:22:0'+(Math.floor(Math.random()*9))+'Z] '+l[1]+'</div>';
  }).join('');
  document.getElementById('logPeek').textContent=s.log.length+' entries';

  /* config is recessive — but promotes itself the moment it is the blocker */
  var cfg=document.getElementById('configBlock'),peek=document.getElementById('configPeek'),
      sum=document.getElementById('configSummary'),inp=document.getElementById('tempDirectory');
  inp.value=s.temp;
  peek.textContent=s.temp?(s.temp.length>24?'…'+s.temp.slice(-23):s.temp):'not set — required';
  peek.title=s.temp||'';
  cfg.open=!s.temp;
  sum.className=s.temp?'':'needs';
}

/* dev switcher */
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('bare')==='1')document.body.classList.add('bare');
  var cur=q.get('state')||'connected-idle';
  var bar=document.getElementById('devbar');
  ORDER.forEach(function(k){
    var a=document.createElement('a');
    a.href='?state='+k+(q.get('bare')==='1'?'&bare=1':'');
    a.textContent=k; if(k===cur)a.setAttribute('aria-current','true');
    a.onclick=function(e){e.preventDefault();history.replaceState(0,'',a.href);
      [].forEach.call(bar.querySelectorAll('a'),function(x){x.removeAttribute('aria-current')});
      a.setAttribute('aria-current','true');render(k)};
    bar.appendChild(a);
  });
  render(cur);
})();
