<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP Bridge (CEP)</title>
<style>
/* ============================================================================
   SLATE & TALLY  —  Premiere MCP bridge panel
   The slate is the identity: a painted field, silkscreened labels, grease-pencil
   values, hard rules, no rounded corners, no shadows.
   The tally is the state: area, not a dot. Hard on, hard off, readable across a
   room. The two lamps ARE #connectionStatus and #serverStatus, which the live
   bridge already drives with a wholesale className write, so every style hook
   below hangs off .status-dot.connected / .status-dot.disconnected only.
   Engine floor is CEP 10 / Chromium ~76: no clamp(), no flex gap, no :has(),
   no :focus-visible, no inset, no aspect-ratio, no container queries.
   ========================================================================== */

/* --- Theme tiers. Premiere has FOUR brightness levels; panelBackgroundColor
       picks one of these at runtime. Contrast is validated against the board of
       each tier, including the lightest (~#b0aeaa). --tally is the lamp FILL
       (bounded by a compliant keyline); --tally-ink carries text and rules and
       is the one that must clear 3:1 on its own. ------------------------- */
html[data-theme="darkest"] {
  --board:#1b1815; --board-deep:#100e0b; --board-up:#252119;
  --pencil:#f4efe4; --chalk:#9d9484;
  --tally:#ff3b21; --tally-ink:#ff6a55;
  --rule:rgba(244,239,228,.16); --rule-hard:rgba(244,239,228,.34);
  --hatch:rgba(244,239,228,.30);
}
html[data-theme="dark"] {
  --board:#23201c; --board-deep:#16140f; --board-up:#2d2921;
  --pencil:#f2ece1; --chalk:#a49a88;
  --tally:#ff3b21; --tally-ink:#ff5c46;
  --rule:rgba(242,236,225,.17); --rule-hard:rgba(242,236,225,.36);
  --hatch:rgba(242,236,225,.32);
}
html[data-theme="light"] {
  --board:#8e8b86; --board-deep:#7c7975; --board-up:#9a9792;
  --pencil:#16140f; --chalk:#3d3a35;
  --tally:#c31606; --tally-ink:#7a0d00;
  --rule:rgba(20,18,14,.30); --rule-hard:rgba(20,18,14,.55);
  --hatch:rgba(20,18,14,.42);
}
html[data-theme="lightest"] {
  --board:#b0aeaa; --board-deep:#a09e9a; --board-up:#bcbab6;
  --pencil:#14120e; --chalk:#45423d;
  --tally:#c31606; --tally-ink:#8f1102;
  --rule:rgba(20,18,14,.28); --rule-hard:rgba(20,18,14,.50);
  --hatch:rgba(20,18,14,.40);
}
html {
  --host-font: "Adobe Clean", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  /* The clapper. Used only for the watchdog fill and the strike on a bad take. */
  --clapper: repeating-linear-gradient(-45deg,
              var(--hatch) 0, var(--hatch) 2px,
              transparent 2px, transparent 6px);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--board);
  color:var(--pencil);
  font-family:var(--host-font);
  font-size:12px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit}

/* Nothing in this panel is a card. Rules do the dividing. */
.wrap{min-height:100%;display:flex;flex-direction:column}

/* ---- masthead: the clapper rule ---------------------------------------- */
.clap{height:5px;background:var(--clapper);border-bottom:1px solid var(--rule-hard);flex:0 0 auto}

/* ---- HEAD: lamps + watchdog + the one action. Always above the fold. ---- */
.head{flex:0 0 auto;padding:10px 12px 11px;border-bottom:1px solid var(--rule-hard);background:var(--board)}

.lamps{display:grid;grid-template-columns:1fr;gap:8px}
.lamp{display:flex;align-items:center}

/* ======================= THE TALLY =====================================
   #connectionStatus and #serverStatus. Area, hard edges, an inner bar so
   OFF is unmistakably off rather than merely dim. Both classes are set by
   the live bridge; every rule here keys off those two class names alone.
   ===================================================================== */
.status-dot{
  position:relative;flex:0 0 auto;border-radius:0;
  width:40px;height:40px;margin-right:11px;
}
.status-dot.disconnected{
  background:var(--board-deep);
  box-shadow:inset 0 0 0 1px var(--rule-hard);
}
.status-dot.disconnected::after{           /* the dead filament */
  content:"";position:absolute;left:8px;right:8px;top:50%;height:3px;
  margin-top:-1px;background:var(--chalk);opacity:.42;
}
.status-dot.connected{
  background:var(--tally);
  box-shadow:inset 0 0 0 1.5px var(--pencil);
}
.status-dot.connected::after{              /* the hot filament */
  content:"";position:absolute;left:7px;right:7px;top:50%;height:5px;
  margin-top:-2px;background:#fff;opacity:.92;
}
/* Minor lamp: same language, smaller. Hierarchy is size, not colour. */
.lamp-minor .status-dot{width:22px;height:22px;margin-right:11px;margin-left:9px}
.lamp-minor .status-dot.disconnected::after{left:4px;right:4px;height:2px;margin-top:-1px}
.lamp-minor .status-dot.connected::after{left:4px;right:4px;height:3px;margin-top:-1.5px}

.lamp-read{min-width:0;flex:1 1 auto}
.lamp-label{
  display:block;font-size:9px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--chalk);margin-bottom:1px;
}
/* #connectionText / #serverText — the live bridge writes textContent here. */
.status-text{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.lamp-minor .status-text{font-size:12px;font-weight:700;letter-spacing:0}
.lamp-note{display:block;font-size:10px;color:var(--chalk);margin-top:1px;word-break:break-word}

/* ---- watchdog track: the clapper stripe, doing a job ------------------- */
.wd{margin-top:11px}
.wd-cap{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.wd-cap b{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--chalk)}
.wd-cap span{font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums;color:var(--pencil)}
.wd-track{
  position:relative;height:14px;background:var(--board-deep);
  box-shadow:inset 0 0 0 1px var(--rule-hard);
}
.wd-fill{position:absolute;left:0;top:0;bottom:0;background:var(--clapper);border-right:2px solid var(--tally-ink)}
/* Second deadline on the same axis: the server gives up at 8s of the 45s watchdog. */
.wd-tick{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--tally-ink)}
.wd-empty{
  position:absolute;left:8px;right:8px;top:0;bottom:0;
  display:flex;align-items:center;
  font-family:var(--mono);font-size:10px;color:var(--chalk);
}
.wd-legend{margin-top:4px;font-size:10px;color:var(--chalk)}
.wd-legend em{font-style:normal;font-family:var(--mono);color:var(--pencil)}

/* ---- action: :disabled{display:none} leaves exactly one visible ------- */
.acts{margin-top:11px;display:flex;align-items:center;flex-wrap:wrap}
button{
  -webkit-appearance:none;appearance:none;border-radius:0;cursor:pointer;
  font-size:12px;font-weight:700;letter-spacing:.01em;
}
#startButton,#stopButton{
  flex:1 1 auto;padding:9px 12px;border:1px solid var(--pencil);
  background:var(--pencil);color:var(--board);
}
#startButton:disabled,#stopButton:disabled{display:none}
.quiet{
  border:0;background:none;color:var(--chalk);padding:9px 8px;
  text-decoration:underline;text-underline-offset:2px;font-weight:400;
}
.quiet:hover{color:var(--pencil)}
button:focus,input:focus,select:focus,[tabindex]:focus{
  outline:2px solid var(--tally-ink);outline-offset:2px;
}

/* ---- BODY -------------------------------------------------------------- */
.body{flex:1 1 auto;min-height:0;overflow-y:auto}
.sec{border-bottom:1px solid var(--rule);padding:11px 12px 12px}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.sec-h h2{margin:0;flex:0 0 auto;white-space:nowrap;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--chalk)}
.sec-h .sub{
  flex:0 1 auto;min-width:0;padding-left:10px;text-align:right;
  font-family:var(--mono);font-size:10px;color:var(--chalk);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ---- the marked take: what happened, and what to do about it ---------- */
.ng{border-top:1px solid var(--rule-hard);padding:11px 12px 12px;background:var(--board-up)}
.ng-strike{height:7px;background:var(--clapper);margin-bottom:9px}
.ng-chip{
  display:inline-block;background:var(--pencil);color:var(--board);
  font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  padding:2px 6px;margin-bottom:6px;
}
.ng-what{font-size:13px;font-weight:700;line-height:1.3;margin:0 0 5px;word-break:break-word}
.ng-do{font-size:11px;line-height:1.5;margin:0;color:var(--pencil)}
.ng-when{margin-top:6px;font-family:var(--mono);font-size:10px;color:var(--chalk)}

/* ---- slate field grid: silkscreened label, grease-pencil value -------- */
.fields{border-top:1px solid var(--rule)}
.f{display:flex;align-items:baseline;border-bottom:1px solid var(--rule);padding:6px 0 5px}
/* 84px because "Production" at .14em needs ~72px and a flex item's min-width
   defaults to auto, so a tighter basis silently pushes into the value column. */
.f-l{
  flex:0 0 84px;font-size:9px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--chalk);padding-top:2px;padding-right:10px;
}
.f-v{
  flex:1 1 auto;min-width:0;font-size:13px;font-weight:700;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.f-v.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:0}
.f-v.path{font-family:var(--mono);font-size:11px;font-weight:400;white-space:normal;word-break:break-all;letter-spacing:0}
/* THE HONESTY RULE. An unmarked slate field is not a field marked zero. */
.f-v.unknown{color:var(--chalk);font-weight:400;font-family:var(--mono);font-size:13px}
.f-sub{display:block;font-size:10px;font-weight:400;color:var(--chalk);letter-spacing:0;font-family:var(--host-font)}

/* ---- last twelve: marks, the way a director circles a take ------------ */
.marks{display:flex;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.mk{
  width:15px;height:19px;margin-right:1px;
  font-family:var(--mono);font-size:12px;line-height:19px;text-align:center;
  background:var(--board-deep);
}
.mk.ran{color:var(--pencil)}
.mk.failed{color:var(--tally-ink);font-weight:700}
.mk.rejected{color:var(--chalk)}
.mk.none{color:var(--chalk);background:none}
.marks-key{font-size:10px;color:var(--chalk)}
.marks-med{font-family:var(--mono);font-size:10px;color:var(--pencil);margin-bottom:5px;font-variant-numeric:tabular-nums}
.marks-key i{font-style:normal;font-family:var(--mono);color:var(--pencil)}

/* ---- queue: #commandQueue innerHTML is replaced by the live bridge, so
       .command-item / .command-label / .command-status must carry the look. */
.command-queue{border-top:1px solid var(--rule)}
.command-item{
  display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--rule);padding:6px 0 5px;
}
.command-label{
  flex:1 1 0%;min-width:0;font-family:var(--mono);font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px;
}
.command-status{
  flex:0 0 auto;padding-left:12px;font-size:9px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--chalk);
}
.command-status.executing{color:var(--tally-ink)}
.command-status.pending{color:var(--pencil)}
.command-status.completed{color:var(--chalk)}
.q-age{flex:0 0 auto;font-family:var(--mono);font-size:10px;color:var(--chalk);padding-left:8px;font-variant-numeric:tabular-nums}
.empty{font-size:11px;color:var(--chalk);padding:6px 0}
.empty.unsure{color:var(--pencil)}

/* ---- log tape --------------------------------------------------------- */
.log-container{border-top:1px solid var(--rule);max-height:150px;overflow-y:auto}
.log-entry{
  font-family:var(--mono);font-size:10px;line-height:1.5;
  padding:5px 0 5px 8px;border-bottom:1px solid var(--rule);
  border-left:2px solid transparent;word-break:break-word;color:var(--pencil);
}
.log-entry.info{border-left-color:var(--rule-hard)}
.log-entry.warning{border-left-color:var(--chalk)}
.log-entry.error{border-left-color:var(--tally-ink)}
.log-entry .t{color:var(--chalk);margin-right:6px}

/* ---- the temp directory: the one field the user controls -------------- */
#tempDirectory{
  width:100%;background:var(--board-deep);color:var(--pencil);
  border:1px solid var(--rule-hard);border-radius:0;padding:7px 8px;
  font-family:var(--mono);font-size:11px;
}
#tempDirectory::-webkit-input-placeholder{color:var(--chalk)}
.temp-row{display:flex;align-items:baseline;margin-top:4px}
.temp-row .quiet{padding-left:0}
#tempHint{font-size:10px;color:var(--chalk);margin-left:auto;padding-left:10px;text-align:right}

/* ---- prototype-only state switcher ----------------------------------- */
.switch{border-top:1px solid var(--rule-hard);background:var(--board-deep);padding:8px 12px}
.switch b{display:block;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--chalk);margin-bottom:5px}
.switch select{
  -webkit-appearance:none;appearance:none;width:100%;margin-bottom:5px;
  background:var(--board);color:var(--pencil);border:1px solid var(--rule-hard);
  border-radius:0;padding:5px 6px;font-size:11px;
}

/* ---- run cue. Reduced motion gets a static hatch and the numbers. ----- */
@keyframes creep{from{background-position:0 0}to{background-position:24px 0}}
.wd-fill.live{-webkit-animation:creep .9s linear infinite;animation:creep .9s linear infinite}
@media (prefers-reduced-motion:reduce){
  .wd-fill.live{-webkit-animation:none;animation:none}
}

/* ---- COMPACT: 280-359. Must be usable at 280x300. -------------------- */
@media (max-width:359px){
  .status-dot{width:32px;height:32px;margin-right:9px}
  .status-dot.disconnected::after{left:6px;right:6px}
  .status-dot.connected::after{left:6px;right:6px;height:4px;margin-top:-2px}
  .lamp-minor .status-dot{width:18px;height:18px;margin-left:7px;margin-right:9px}
  .status-text{font-size:15px}
  .head,.sec,.ng,.switch{padding-left:10px;padding-right:10px}
  /* At 280 there is no room for a label column. Stack the field: silkscreened
     label above, grease-pencil value below, full width. */
  .f{display:block;padding:5px 0}
  .f-l{padding:0 0 1px;font-size:8px;letter-spacing:.12em}
  .f-v{font-size:12px}
  .lamps{gap:7px}
  .log-container{max-height:120px}
  .command-label{font-size:10px}
  .q-age{display:none}          /* the status word carries more than the age here */
  .mk{width:13px;font-size:11px}
  /* No room for button and hint on one line at 280. */
  .temp-row{display:block}
  #tempHint{display:block;margin-top:2px;padding-left:0;text-align:left}
}

/* ---- DOCKED WIDE: 700+. Board on the left, tape on the right. --------- */
@media (min-width:700px){
  .wrap{display:block}
  .cols{display:grid;grid-template-columns:360px 1fr;gap:0}
  .col-board{border-right:1px solid var(--rule-hard)}
  .head{border-bottom:1px solid var(--rule)}
  .lamps{grid-template-columns:1fr 1fr;align-items:center}
  .lamp-minor .status-dot{margin-left:0}
  .status-dot{width:46px;height:46px}
  .status-text{font-size:19px}
  .body{overflow:visible}
  .log-container{max-height:none}
  .switch{display:flex;align-items:center}
  .switch b{margin:0 10px 0 0}
  .switch select{width:210px;margin:0 8px 0 0}
}
/* ---- DOCKED VERY WIDE: 1000+. Tile the tape two-up rather than letting
       log lines run to 600px. Two grid tracks only; there is no third child. */
@media (min-width:1000px){
  .cols{grid-template-columns:420px 1fr}
  .col-tape .body{display:grid;grid-template-columns:1fr 1fr}
  .col-tape .body>.sec:nth-child(odd){border-right:1px solid var(--rule)}
  /* Two-up columns are ~300px. The command id is what you quote in a bug report,
     so it keeps the room; the age that matters (oldest) is in the subhead. */
  .q-age{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="clap"></div>

  <div class="cols">
  <div class="col-board">
    <!-- ================= HEAD: the tally ================= -->
    <div class="head">
      <div class="lamps">
        <div class="lamp lamp-major">
          <div class="status-dot disconnected" id="connectionStatus"></div>
          <div class="lamp-read">
            <span class="lamp-label">Bridge</span>
            <span class="status-text" id="connectionText">Disconnected</span>
            <span class="lamp-note" id="bridgeNote">Not polling the temp directory</span>
          </div>
        </div>
        <div class="lamp lamp-minor">
          <div class="status-dot disconnected" id="serverStatus"></div>
          <div class="lamp-read">
            <span class="lamp-label">Premiere</span>
            <span class="status-text" id="serverText">Not started</span>
          </div>
        </div>
      </div>

      <!-- watchdog: the clapper stripe carrying the deadline -->
      <div class="wd">
        <div class="wd-cap"><b>In flight</b><span id="wdRead">—</span></div>
        <div class="wd-track">
          <div class="wd-fill" id="wdFill" style="display:none"></div>
          <div class="wd-tick" id="wdTick" style="display:none"></div>
          <div class="wd-empty" id="wdEmpty">—</div>
        </div>
        <div class="wd-legend" id="wdLegend">Nothing is crossing the bridge.</div>
      </div>

      <div class="acts">
        <button class="primary" id="startButton" onclick="startBridge()">Start bridge</button>
        <button class="secondary" id="stopButton" onclick="stopBridge()" disabled>Stop bridge</button>
        <button class="quiet" id="diagnosticsButton" onclick="runDiagnostics()">Diagnostics</button>
      </div>
    </div>

    <!-- ================= the marked take ================= -->
    <div class="ng" id="ngBlock" style="display:none">
      <div class="ng-strike"></div>
      <span class="ng-chip" id="ngChip">Command failed</span>
      <p class="ng-what" id="ngWhat"></p>
      <p class="ng-do" id="ngDo"></p>
      <div class="ng-when" id="ngWhen"></div>
    </div>

    <!-- ================= slate fields ================= -->
    <!-- The one thing the user actually sets. It sits in the board column
         directly under the error block that tells them to set it, so it is
         never below the fold in the temp-dir-unset state. -->
    <div class="sec">
      <div class="sec-h"><h2>Shared temp directory</h2></div>
      <input type="text" id="tempDirectory" placeholder="/tmp/premiere-mcp-bridge">
      <div class="temp-row">
        <button class="quiet" onclick="saveConfig()">Save directory</button>
        <span id="tempHint"></span>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h"><h2>Slate</h2><span class="sub" id="fpsRead">24 fps</span></div>
      <div class="fields" id="fields"></div>
    </div>
  </div>

  <div class="col-tape">
    <div class="body">
      <!-- ================= queue ================= -->
      <div class="sec">
        <div class="sec-h"><h2>Queue</h2><span class="sub" id="queueSub">—</span></div>
        <div class="command-queue" id="commandQueue"></div>
      </div>

      <!-- ================= last twelve ================= -->
      <div class="sec">
        <div class="sec-h"><h2>Last twelve</h2><span class="sub" id="marksSub">—</span></div>
        <div class="marks" id="marks"></div>
        <div class="marks-med" id="marksMed">—</div>
        <div class="marks-key"><i>o</i> ran &nbsp; <i>x</i> failed &nbsp; <i>/</i> rejected &nbsp; <i>·</i> no record</div>
      </div>

      <!-- ================= channel ================= -->
      <div class="sec">
        <div class="sec-h"><h2>Channel</h2><span class="sub" id="chanSub">—</span></div>
        <div class="fields" id="chanFields"></div>
      </div>

      <!-- ================= log ================= -->
      <div class="sec">
        <div class="sec-h"><h2>Log</h2><span class="sub"><button class="quiet" style="padding:0;font-size:10px" onclick="clearLog()">Clear</button></span></div>
        <div class="log-container" id="logContainer"></div>
      </div>
    </div>
  </div>
  </div>

  <div class="switch">
    <b>Prototype</b>
    <select id="stateSel" aria-label="Panel state"></select>
    <select id="themeSel" aria-label="Premiere brightness"></select>
  </div>
</div>

<script src="CSInterface.js"></script>
<script>
/* ==========================================================================
   Live-code stubs. In Premiere these come from bridge-cep.js.
   ====================================================================== */
function startBridge(){ apply('connected-idle'); }
function stopBridge(){ apply('disconnected'); }
function runDiagnostics(){}
function saveConfig(){}
function clearLog(){ document.getElementById('logContainer').innerHTML=''; }

/* ==========================================================================
   THEME. Premiere ships four brightness levels; the panel currently ignores
   all of them and is a black rectangle on the two light ones. Read the host
   colour, bucket it by luminance, pick a token tier.
   ====================================================================== */
function srgb(c){c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);}
function lum(r,g,b){return .2126*srgb(r)+.7152*srgb(g)+.0722*srgb(b);}
function tierFor(L){return L<.035?'darkest':L<.22?'dark':L<.40?'light':'lightest';}
var THEMES=['darkest','dark','light','lightest'];

function adoptHost(){
  try{
    if(typeof CSInterface!=='function' && typeof CSInterface!=='object') return null;
    var cs=new CSInterface();
    var env=cs.hostEnvironment||{}, skin=env.appSkinInfo;
    if(!skin) return null;
    if(skin.baseFontFamily){
      /* Adobe Clean ships with Premiere. No web app can use it. */
      document.documentElement.style.setProperty('--host-font',
        '"'+skin.baseFontFamily+'", "Adobe Clean", "Helvetica Neue", Helvetica, Arial, sans-serif');
    }
    var c=skin.panelBackgroundColor && skin.panelBackgroundColor.color;
    if(c) return tierFor(lum(c.red,c.green,c.blue));
  }catch(e){}
  return null;
}

/* ==========================================================================
   24 fps vernacular. An editor thinks in frames, so every duration carries
   both. UNKNOWN IS NEVER ZERO: null renders as an em dash.
   ====================================================================== */
var FPS=24, FRAME_MS=1000/FPS;
function frames(ms){return ms/FRAME_MS;}
function ms_f(ms){
  if(ms==null) return null;
  var f=frames(ms);
  return (ms>=1000? (ms/1000).toFixed(1)+' s' : Math.round(ms)+' ms')
       + ' · ' + (f>=100?Math.round(f):f.toFixed(1)) + 'f';
}
function tc(ms){
  if(ms==null) return null;
  var tf=Math.round(ms/FRAME_MS), p=function(n){return (n<10?'0':'')+n;};
  return p(Math.floor(tf/86400))+':'+p(Math.floor(tf/1440)%60)+':'+p(Math.floor(tf/24)%60)+':'+p(tf%24);
}
function age(ms){ return ms==null?null:(ms/1000).toFixed(1)+' s ago'; }

/* ==========================================================================
   RENDER
   ====================================================================== */
function el(id){return document.getElementById(id);}
function mark(v){ /* the honesty helper */
  return v==null? {t:'—', k:'unknown'} : {t:String(v), k:''};
}
function field(label,v,cls,sub){
  var m=mark(v);
  return '<div class="f"><div class="f-l">'+label+'</div><div class="f-v '+(m.k||cls||'')+'" title="'+m.t+'">'+m.t
       + (sub && !m.k ? '<span class="f-sub">'+sub+'</span>' : '') + '</div></div>';
}

function apply(name){
  var d=S[name]; if(!d) return;
  el('stateSel').value=name;
  try{history.replaceState(null,'','?state='+name);}catch(e){}

  /* --- the tally. Exactly the class strings the live bridge writes. --- */
  el('connectionStatus').className='status-dot '+(d.bridge===1?'connected':'disconnected');
  el('serverStatus').className='status-dot '+(d.host===1?'connected':'disconnected');
  el('connectionText').textContent=d.connectionText;
  el('serverText').textContent=d.serverText;
  el('bridgeNote').textContent=d.bridgeNote;

  /* --- start/stop exactly as the live code drives them --- */
  var connected = d.bridge===1;
  el('startButton').disabled=connected;
  el('stopButton').disabled=!connected;

  /* --- watchdog stripe --- */
  var fill=el('wdFill'), tick=el('wdTick'), empty=el('wdEmpty');
  if(d.cmd && d.elapsed!=null){
    var pct=Math.min(100, d.elapsed/WATCHDOG*100);
    fill.style.display='block'; fill.style.width=pct.toFixed(1)+'%';
    fill.className='wd-fill live';
    tick.style.display='block'; tick.style.left=(SERVER_BUDGET/WATCHDOG*100).toFixed(1)+'%';
    empty.style.display='none';
    el('wdRead').textContent=ms_f(d.elapsed)+'  ·  '+tc(d.elapsed);
    el('wdLegend').innerHTML='Killed in <em>'+ms_f(WATCHDOG-d.elapsed)+'</em>. The server stops waiting at <em>8 s</em>.';
  }else{
    fill.style.display='none'; fill.className='wd-fill';
    tick.style.display='none';
    empty.style.display='flex';
    el('wdRead').textContent='—';
    el('wdLegend').innerHTML = connected
      ? 'Nothing is crossing the bridge. A command that runs past <em>45 s</em> is killed.'
      : 'The bridge is not polling, so nothing can cross it.';
  }

  /* --- the marked take --- */
  var ng=el('ngBlock');
  if(d.err){
    ng.style.display='block';
    el('ngChip').textContent=d.err.chip;
    el('ngWhat').textContent=d.err.what;
    el('ngDo').textContent=d.err.doThis;
    el('ngWhen').textContent=d.err.at+(d.err.cid?'  ·  '+d.err.cid:'');
  }else{ ng.style.display='none'; }

  /* --- slate fields: production / camera / scene / take --- */
  el('fields').innerHTML=
      field('Production', d.project, 'path')
    + field('Camera', 'Premiere Pro '+d.version)
    + field('Scene', d.cmd?d.cmd.name:null)
    + field('Take', d.cmd?d.cmd.id:null, 'num');
  el('fpsRead').textContent=FPS+' fps · 1f = '+FRAME_MS.toFixed(1)+' ms';

  /* --- queue. "Empty" and "we are not polling" are different facts. --- */
  var q=el('commandQueue'), sub=el('queueSub');
  if(d.queue==null){
    q.innerHTML='<div class="empty unsure">Unknown — the bridge is not polling, so no queue has been read.</div>';
    sub.textContent='—';
  }else if(d.queue.length===0){
    q.innerHTML='<div class="empty">Queue is empty. The bridge is polling and has nothing waiting.</div>';
    sub.textContent='0 waiting';
  }else{
    q.innerHTML=d.queue.map(function(c){
      return '<div class="command-item"><span class="command-label" title="'+c.name+' '+c.id+'">'+c.name+'  '+c.id
           + '</span><span class="q-age">'+ms_f(c.ageMs)+'</span>'
           + '<span class="command-status pending">waiting</span></div>';
    }).join('');
    var oldest=d.queue[0].ageMs;
    sub.textContent=d.queue.length+' waiting · oldest '+ms_f(oldest);
  }

  /* --- last twelve: marks, not a vanity counter --- */
  var G={ran:'o',failed:'x',rejected:'/'};
  var mrow='';
  if(d.takes==null){
    for(var i=0;i<12;i++) mrow+='<div class="mk none">·</div>';
    el('marksSub').textContent='—';
  }else{
    var n={ran:0,failed:0,rejected:0};
    for(var j=0;j<12;j++){
      var k=d.takes[j]; if(!k){mrow+='<div class="mk none">·</div>';continue;}
      n[k]++; mrow+='<div class="mk '+k+'" title="'+k+'">'+G[k]+'</div>';
    }
    el('marksSub').textContent=n.ran+' ran · '+n.failed+' failed · '+n.rejected+' rejected';
  }
  el('marks').innerHTML=mrow;
  el('marksMed').textContent = 'Median round trip '+(d.median==null?'—':ms_f(d.median));

  /* --- channel --- */
  var hbSub = d.hb==null ? '' : (d.hb<HB_STALE?'fresh':'stale')+' — the server calls it stale at 4 s';
  el('chanFields').innerHTML=
      field('Heartbeat', age(d.hb), 'num', hbSub)
    + field('Auth', d.auth==null?null:(d.auth==='token'?'Per-session token':'Unauthenticated'),
            '', d.auth==='legacy'?'Older server writes no token file':'Token read from auth-token.json')
    + field('Rejected', d.rejected==null?null:d.rejected+(d.rejected===1?' command':' commands'), 'num');
  el('chanSub').textContent = d.auth==null ? '—' : (d.rejected>0 ? d.rejected+' rejected' : 'authenticated');

  el('tempDirectory').value=d.temp;
  el('tempHint').textContent=d.tempHint;

  /* --- log tape. .log-entry + level, as the live code writes it. --- */
  el('logContainer').innerHTML=d.log.map(function(L){
    return '<div class="log-entry '+L[2]+'"><span class="t">'+L[0]+'</span>'+L[1]+'</div>';
  }).join('');
}

/* --- boot ------------------------------------------------------------- */
(function(){
  var ss=el('stateSel'), ts=el('themeSel');
  ORDER.forEach(function(k){ var o=document.createElement('option'); o.value=k; o.textContent=k; ss.appendChild(o); });
  THEMES.forEach(function(k){ var o=document.createElement('option'); o.value=k; o.textContent='Premiere '+k; ts.appendChild(o); });
  ss.onchange=function(){apply(this.value);};
  ts.onchange=function(){document.documentElement.setAttribute('data-theme',this.value);};

  var qs={};
  location.search.replace(/^\?/,'').split('&').forEach(function(p){
    var kv=p.split('='); if(kv[0]) qs[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||'');
  });

  var theme = adoptHost() || (THEMES.indexOf(qs.theme)>=0 ? qs.theme : 'dark');
  document.documentElement.setAttribute('data-theme', theme);
  ts.value=theme;

  apply(S[qs.state]?qs.state:'connected-idle');
})();
</script>
