<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP Bridge (CEP)</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   DIRECTION: LEADER
   The panel is a length of film. Perforations down the edge = the channel.
   Frames divided by frame lines = the panel's sections. A scribed leader
   count = the watchdog deadline. A punched hole = the frame that failed.
   Radius exists in exactly one place: the corners of a perforation.
   ═══════════════════════════════════════════════════════════════════════════ */

:root{
  /* set from csInterface.hostEnvironment.appSkinInfo.baseFontFamily at runtime */
  --f-ui:"Adobe Clean","Source Sans Pro",-apple-system,"Segoe UI",Roboto,sans-serif;
  /* condensed engineering grotesque — the leader numeral / DIN scribe */
  --f-count:"DIN Alternate","DIN Condensed","Haettenschweiler","Arial Narrow","Roboto Condensed","Helvetica Neue",sans-serif;
  --f-data:"SF Mono",Menlo,"DejaVu Sans Mono",Consolas,monospace;

  /* Premiere's four user brightness levels, verbatim. --base is overwritten
     from appSkinInfo.panelBackgroundColor; these are the shipped values. */
  --base:#1e1e1e;
  --proto-h:44px;   /* prototype state bar. 0 in the shipped panel. */

  /* PALETTE — 6 named values, all from film material                        */
  --ink:#f2efe6;      /* leader white: the printed line-art of Academy leader */
  --perf:#a09a8e;     /* sprocket gray: rails, secondary text                 */
  --cue:#e8a33c;      /* reel-change cue: the count, the deadline             */
  --punch:#e8564a;    /* the punched frame: broken, and the last 3 seconds    */
  --pop:#59c98d;      /* the sync pop: a command came back                    */
  --rule:rgba(242,239,230,.17);
  --band:rgba(0,0,0,.45);   /* the interframe bar between two frames */
  --well:rgba(0,0,0,.24);
  --hole:rgba(0,0,0,.62);
}
/* Premiere's two light brightness levels. The mid-light surface (#8f8f8f) is
   the hardest, not the lightest — every ink below clears 3:1 against it. */
body.t-light,body.t-lightest{
  --ink:#17150f; --perf:#38332b; --cue:#5e3300; --punch:#7d0e07; --pop:#0f4527;
  --rule:rgba(23,21,15,.26); --well:rgba(23,21,15,.09); --hole:rgba(23,21,15,.78);
  --band:rgba(23,21,15,.24);
}
body.t-darkest{--base:#1e1e1e}
body.t-dark{--base:#323232}
body.t-light{--base:#8f8f8f}
body.t-lightest{--base:#b8b8b8}

*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{
  background:var(--base); color:var(--ink);
  font:12px/1.5 var(--f-ui);
  -webkit-font-smoothing:antialiased;
  padding-bottom:var(--proto-h);
}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums;-moz-font-feature-settings:"tnum";font-feature-settings:"tnum"}

/* ── the strip ──────────────────────────────────────────────────────────── */
.strip{display:flex;align-items:stretch;min-height:100vh}
.body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.col{display:flex;flex-direction:column;min-width:0}

/* ── perforation rails ─────────────────────────────────────────────────── */
.rail{flex:0 0 auto;overflow:hidden;background:var(--well)}
.rail-l{width:17px;padding:7px 0;display:flex;flex-direction:column;align-items:center}
.rail-h{display:none;height:13px;padding:0 8px;align-items:center}
.perf{
  flex:0 0 auto;width:9px;height:6px;border-radius:1.5px;
  background:transparent;box-shadow:inset 0 0 0 1px var(--perf);
}
.rail-l .perf{margin-bottom:7px}
.rail-h .perf{width:6px;height:9px;margin-right:8px}
/* channel open: perforations are struck solid */
.rail.open .perf{background:var(--ink);box-shadow:none;opacity:.62}
/* heartbeat older than the server's 4s staleness threshold */
.rail.stale .perf{background:var(--punch);box-shadow:none;opacity:.8}
/* opening: cue-coloured outline, no fill yet */
.rail.arming .perf{box-shadow:inset 0 0 0 1px var(--cue)}

/* ── frames + frame lines ──────────────────────────────────────────────── */
.frame{position:relative;padding:28px 14px 15px}
.frame+.frame{border-top:3px solid var(--band)}
/* edge code: printed just under the interframe bar, the way latent edge
   numbers run along the film edge. The bar itself is never broken. */
.edge{
  position:absolute;top:8px;left:14px;
  font:600 9px/10px var(--f-data);letter-spacing:.13em;
  color:var(--perf);text-transform:uppercase;
}

/* ── frame 1 · channel ─────────────────────────────────────────────────── */
.line{display:flex;align-items:flex-start;gap:9px;margin-bottom:8px}
/* Geometry is set by ID because live code overwrites className wholesale. */
#connectionStatus,#serverStatus{
  flex:0 0 auto;width:9px;height:9px;margin-top:5px;border-radius:1.5px;
  background:transparent;box-shadow:inset 0 0 0 1px var(--perf);
}
.connected{background:var(--pop)!important;box-shadow:none!important}
.disconnected{background:var(--punch)!important;box-shadow:none!important}
#connectionText,#serverText{flex:1 1 auto;min-width:0;font:600 12.5px/1.45 var(--f-ui);word-break:break-word}
.sub{margin:2px 0 0;font-size:11px;line-height:1.5;color:var(--perf)}
.sub .mono{color:var(--perf)}

/* ── the one action ────────────────────────────────────────────────────── */
.act{margin-top:12px}
button{
  font:600 12px/1 var(--f-ui);letter-spacing:.01em;
  -webkit-appearance:none;appearance:none;cursor:pointer;
  border:1px solid var(--ink);border-radius:0;
  padding:10px 15px;background:var(--ink);color:var(--base);
}
button:hover{background:var(--cue);border-color:var(--cue)}
body.t-light button:hover,body.t-lightest button:hover{color:#f2efe6}
button.ghost{background:transparent;color:var(--ink);border-color:var(--perf)}
button.ghost:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
button:disabled{display:none} /* live code toggles .disabled; one visible action, no JS */
:focus{outline:2px solid var(--cue);outline-offset:2px}
body.t-light :focus,body.t-lightest :focus{outline-color:var(--punch)}

/* ── frame · what broke (the punch) ────────────────────────────────────── */
.broke{border-left:2px solid var(--punch);padding-left:12px}
.broke.notice{border-left-color:var(--cue)}
.punchrow{display:flex;gap:11px;align-items:flex-start}
.hole{
  flex:0 0 auto;width:20px;height:20px;margin-top:1px;border-radius:1.5px;
  background:var(--hole);box-shadow:inset 0 0 0 1px var(--punch);
}
.broke.notice .hole{box-shadow:inset 0 0 0 1px var(--cue)}
.what{margin:0;font:600 12.5px/1.45 var(--f-ui)}
.fix{margin:5px 0 0;font-size:11.5px;line-height:1.55;color:var(--perf)}
.stamp{margin:7px 0 0;font:10px/1.4 var(--f-data);color:var(--perf);letter-spacing:.04em}

/* ── frame 2 · the count (signature) ──────────────────────────────────── */
.count{display:flex;gap:14px;align-items:flex-start}
.scribe{position:relative;flex:0 0 auto;width:76px;height:76px}
.scribe svg{display:block;width:76px;height:76px;transform:rotate(-90deg)}
.scribe .track{fill:none;stroke:var(--rule);stroke-width:2}
.scribe .idle{fill:none;stroke:var(--perf);stroke-width:1;stroke-dasharray:2 4;opacity:.85}
.scribe .sweep{fill:none;stroke:var(--cue);stroke-width:3;stroke-linecap:butt;
  transition:stroke-dashoffset .7s cubic-bezier(.3,0,.2,1)}
.num{
  position:absolute;left:0;right:0;top:0;bottom:0;
  display:flex;align-items:center;justify-content:center;
  font:400 38px/1 var(--f-count);letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;
}
.num.wait{font-size:26px;color:var(--perf)}       /* the honest em-dash      */
.num.leader{color:var(--cue)}                      /* inside 8 s — leader     */
.num.last{color:var(--punch)}                      /* inside 3 s             */
.scribe.last .sweep{stroke:var(--punch);stroke-width:4}
.count-body{flex:1 1 auto;min-width:0;padding-top:1px}
.dim .scribe,.dim .scribe svg{width:32px;height:32px}
.dim .num{font-size:16px}
.dim .num.wait{font-size:15px}
.dim .count{align-items:center}
.dim .cmd,.dim .ruler{display:none}
.dim .deadline{margin:0}
.deadline{margin:0 0 3px;font:600 13px/1.3 var(--f-ui)}
.cmd{margin:0;font:11.5px/1.5 var(--f-data);color:var(--ink);overflow-wrap:break-word}
.cmdid{display:block;color:var(--perf);font-size:10.5px;letter-spacing:.02em}
.budget{margin:7px 0 0;font-size:11px;line-height:1.5;color:var(--perf)}

/* ── the frame ruler: the watchdog laid out as frames, punched at the cue ─ */
.ruler{margin-top:13px}
.ticks{display:flex;align-items:flex-end;height:16px}
.tick{flex:1 1 0;min-width:1px;height:7px;background:var(--perf);opacity:.45}
.tick.sec{height:12px;margin-right:2px}
.tick.on{background:var(--cue);opacity:1}
.tick.kill{flex:0 0 3px;height:16px;background:var(--punch);opacity:1;margin-left:3px}
.rlabels{display:flex;justify-content:space-between;margin-top:5px;font:9.5px/1.3 var(--f-data);color:var(--perf);letter-spacing:.03em}
.rlabels b{color:var(--ink);font-weight:600}

/* ── frame 3 · queue ──────────────────────────────────────────────────── */
#commandQueue{margin:0}
.q{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-top:1px dotted var(--rule)}
.q:first-child{border-top:0}
.qn{flex:1 1 auto;min-width:0;font:11.5px/1.4 var(--f-data);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qa{flex:0 0 auto;white-space:nowrap;font:10.5px/1.4 var(--f-data);color:var(--perf);letter-spacing:.02em}
.q.none .qn{color:var(--perf)}
.pop{display:inline-block;width:6px;height:6px;background:var(--pop);border-radius:1px;margin-right:5px;vertical-align:1px}

/* ── frame · shared folder ────────────────────────────────────────────── */
label{display:block;font-size:11px;color:var(--perf);margin-bottom:6px;line-height:1.5}
input[type=text]{
  width:100%;padding:9px 10px;border:1px solid var(--perf);border-radius:0;
  background:var(--well);color:var(--ink);font:11.5px/1.3 var(--f-data);
}
input[type=text]::-webkit-input-placeholder{color:var(--perf)}
input[type=text]:focus{border-color:var(--cue)}
.fldrow{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}

/* ── frame · log ──────────────────────────────────────────────────────── */
#logContainer{margin:0;max-height:134px;overflow-y:auto}
.log-entry{display:flex;gap:8px;padding:5px 0;font:10.5px/1.45 var(--f-data);border-top:1px dotted var(--rule);color:var(--perf)}
.log-entry:first-child{border-top:0}
.log-entry .t{flex:0 0 auto;letter-spacing:.02em}
.log-entry .m{flex:1 1 auto;min-width:0;word-break:break-word;color:var(--ink)}
.log-entry.warning .m{color:var(--cue)}
.log-entry.error .m{color:var(--punch)}

/* ── prototype state bar (not part of the panel) ──────────────────────── */
.proto{
  position:fixed;left:0;right:0;bottom:0;z-index:9;
  display:flex;flex-wrap:wrap;gap:3px;align-items:center;
  padding:5px 6px;background:var(--base);border-top:1px solid var(--rule);
}
.proto button{
  padding:3px 6px;font:9.5px/1.25 var(--f-data);letter-spacing:.02em;
  background:transparent;color:var(--perf);border:1px solid var(--rule);
}
.proto button:hover{background:transparent;color:var(--ink);border-color:var(--ink)}
.proto button[aria-pressed=true]{color:var(--base);background:var(--ink);border-color:var(--ink)}
.proto .lbl{font:9px/1 var(--f-data);color:var(--perf);letter-spacing:.1em;padding:0 2px}
.proto .grp{display:flex;flex-wrap:wrap;gap:3px;min-width:0}

/* ── narrow floor: 280 × 300 ──────────────────────────────────────────── */
@media (max-width:319px){
  .rail-l{width:13px}
  .perf{width:7px;height:5px}
  .frame{padding:12px 10px 13px}
  .frame:first-child{padding-top:27px}
  .scribe,.scribe svg{width:60px;height:60px}
  .num{font-size:30px}
  .num.wait{font-size:22px}
  .count{gap:11px}
  .rlabels{font-size:9px}
}

/* ── docked wide: the strip turns and runs horizontally ───────────────── */
@media (min-width:640px){
  .strip{flex-direction:column;min-height:100vh}
  .rail-l{display:none}
  /* both film edges stay in the gate while the strip scrolls past */
  .rail-h{display:flex;position:-webkit-sticky;position:sticky;z-index:3}
  .rail-t{top:0}
  .rail-b{bottom:var(--proto-h)}
  .body{flex:1 1 auto;display:grid;grid-template-columns:1.15fr 1fr;
        grid-template-rows:auto 1fr;align-items:start}
  .col-a{grid-column:1;grid-row:1}
  .col-b{grid-column:1;grid-row:2;border-top:3px solid var(--band)}
  .col-c{grid-column:2;grid-row:1/span 2;align-self:stretch;border-left:3px solid var(--band)}
  .num{font-size:46px}
  .scribe,.scribe svg{width:88px;height:88px}
  #logContainer{max-height:none}
  .proto{border-top:1px solid var(--rule)}
}
@media (min-width:980px){
  .body{grid-template-columns:.95fr 1.25fr 1fr}
  .col-a{grid-column:1;grid-row:1/span 2}
  .col-b{grid-column:2;grid-row:1/span 2;border-top:0;border-left:3px solid var(--band)}
  .col-c{grid-column:3;grid-row:1/span 2}
  .num{font-size:54px}
  .scribe,.scribe svg{width:104px;height:104px}
}

@media (prefers-reduced-motion:reduce){
  .scribe .sweep,.tick.on{transition:none}
  *{animation:none!important}
}
</style>
</head>
<body class="t-darkest">

<div class="strip">
  <div class="rail rail-h rail-t" id="railT" aria-hidden="true"></div>
  <div class="rail rail-l" id="railL" aria-hidden="true"></div>

  <div class="body">

    <!-- ═══ 1 · is the channel open? ═══ -->
    <div class="col col-a">
      <section class="frame">
        <div class="edge">Channel</div>
        <div class="line">
          <div id="connectionStatus" class="disconnected"></div>
          <div id="connectionText">Nothing can reach Premiere</div>
        </div>
        <div class="line">
          <div id="serverStatus" class="disconnected"></div>
          <div id="serverText">—</div>
        </div>
        <p class="sub" id="hostLine">—</p>
        <p class="sub" id="beatLine">—</p>
        <div class="act">
          <button id="startButton" onclick="startBridge()">Start bridge</button>
          <button id="stopButton" class="ghost" onclick="stopBridge()" disabled>Stop bridge</button>
        </div>
      </section>

      <!-- ═══ 3 · what broke, and what do I do? (punched frame) ═══ -->
      <section class="frame" id="brokeFrame" style="display:none">
        <div class="edge" id="brokeEdge">What broke</div>
        <div class="broke" id="brokeBox">
          <div class="punchrow">
            <div class="hole" aria-hidden="true"></div>
            <div style="min-width:0">
              <p class="what" id="brokeWhat">—</p>
              <p class="fix" id="brokeFix">—</p>
              <p class="stamp mono" id="brokeStamp">—</p>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- ═══ 2 · what is crossing, and how long until its deadline? ═══ -->
    <div class="col col-b">
      <section class="frame" id="countFrame">
        <div class="edge">In flight</div>
        <div class="count">
          <div class="scribe" id="scribe">
            <svg viewBox="0 0 104 104" aria-hidden="true">
              <circle class="track" cx="52" cy="52" r="44"/>
              <circle class="idle" id="idleRing" cx="52" cy="52" r="44"/>
              <circle class="sweep" id="sweep" cx="52" cy="52" r="44"
                      stroke-dasharray="276.5" stroke-dashoffset="276.5"/>
            </svg>
            <div class="num wait mono" id="numeral" role="status" aria-live="polite">—</div>
          </div>
          <div class="count-body">
            <p class="deadline" id="deadlineLine">No command running</p>
            <p class="cmd" id="cmdLine">—</p>
            <p class="budget" id="budgetLine">—</p>
          </div>
        </div>
        <div class="ruler" id="ruler">
          <div class="ticks" id="ticks"></div>
          <div class="rlabels">
            <div id="elapsedTc">—</div>
            <div id="killTc">—</div>
          </div>
        </div>
      </section>
    </div>

    <div class="col col-c">
      <!-- ═══ queue ═══ -->
      <section class="frame">
        <div class="edge">Queue</div>
        <div id="commandQueue">
          <div class="q none"><span class="qn">—</span></div>
        </div>
        <div id="lastTrip"></div>
      </section>

      <!-- ═══ log ═══ -->
      <section class="frame">
        <div class="edge">Log</div>
        <div id="logContainer"></div>
      </section>

      <!-- ═══ shared folder ═══ -->
      <section class="frame">
        <div class="edge">Shared folder</div>
        <label for="tempDirectory">Must match <span class="mono">PREMIERE_TEMP_DIR</span> on the server.</label>
        <input type="text" id="tempDirectory" placeholder="/tmp/premiere-mcp-bridge">
        <div class="fldrow">
          <button class="ghost" onclick="saveConfig()">Save folder</button>
          <button class="ghost" onclick="runDiagnostics()">Run diagnostics</button>
        </div>
        <p class="sub" id="authLine">—</p>
      </section>
    </div>

  </div>
  <div class="rail rail-h rail-b" id="railB" aria-hidden="true"></div>
</div>

<div class="proto" role="group" aria-label="Prototype controls">
  <span class="lbl">STATE</span><span class="grp" id="stateBtns"></span>
  <span class="lbl">THEME</span><span class="grp" id="themeBtns"></span>
</div>

<script>
/* ───────────────────────────────────────────────────────────────────────────
   24 fps show. Durations read in milliseconds AND in frames, because that is
   the unit the person watching this panel actually thinks in.
   ─────────────────────────────────────────────────────────────────────────── */
var FPS = 24;
var WATCHDOG = 45000;   // panel-side default; server may request longer
var BUDGET   = 8000;    // the server's own response budget
var STALE    = 4000;    // server treats a heartbeat older than this as dead

function frames(ms){ return ms / 1000 * FPS; }
function fstr(ms){ var f = frames(ms); return (f < 100 ? f.toFixed(1) : Math.round(f)) + ' f'; }
function msstr(ms){ return ms < 1000 ? Math.round(ms) + ' ms' : (ms/1000).toFixed(1) + ' s'; }
function dur(ms){ return msstr(ms) + ' · ' + fstr(ms); }
/* duration as timecode on the sequence timebase, offset from command start */
function tc(ms){
  var tf = Math.round(frames(ms));
  var f = tf % FPS, s = Math.floor(tf / FPS) % 60, m = Math.floor(tf / (FPS*60)) % 60;
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  return '+00:' + p(m) + ':' + p(s) + ':' + p(f);
}

/* ── mock data ─────────────────────────────────────────────────────────── */
var HOST = 'Premiere Pro 26.3.2';
var PROJ = 'feature_cut_v2.prproj';
var DIR  = '/tmp/premiere-mcp-bridge';

var STATES = {
  'disconnected': {
    conn:['disconnected','Nothing can reach Premiere'],
    srv:['disconnected','Bridge stopped'],
    host:'Premiere Pro 26.3.2 · ' + PROJ,
    beat:'No heartbeat · the server reports the panel as dead',
    rail:'closed', running:false, open:false,
    idleNote:'Start the bridge; the first command gets 45 s.',
    queue:null, trip:null, dir:DIR,
    auth:'Token check starts with the bridge · rejected —',
    log:[['info','11:02:04','Panel loaded. Bridge is stopped.'],
         ['info','11:02:04','Shared folder read from settings: ' + DIR]]
  },
  'starting': {
    conn:['disconnected','Opening the channel'],
    srv:['disconnected','Checking Premiere'],
    host:HOST + ' · ' + PROJ,
    beat:'Writing the first heartbeat',
    rail:'arming', running:false, open:false, starting:true, qnull:'— not polling yet',
    idleNote:'No command yet. The first one gets 45 s.',
    queue:null, trip:null, dir:DIR,
    auth:'Checking the session token',
    log:[['info','11:02:09','Start bridge clicked.'],
         ['info','11:02:09','Polling ' + DIR + ' every 250 ms.'],
         ['info','11:02:09','Checked Premiere: ' + HOST + '.']]
  },
  'connected-idle': {
    conn:['connected','Premiere is taking commands'],
    srv:['connected','Premiere answered in 61 ms · 1.5 f'],
    host:HOST + ' · ' + PROJ,
    beat:'Heartbeat 0.2 s ago · fresh under 4 s',
    rail:'open', running:false, open:true,
    idleNote:'Nothing is running. The next command gets 45 s.',
    queue:[], trip:['apply_lumetri_preset', 144],
    dir:DIR,
    auth:'Per-session token enforced · 0 rejected',
    log:[['info','11:04:12','Bridge open on ' + DIR + '.'],
         ['info','11:04:31','apply_lumetri_preset returned in 144 ms · 3.5 f.'],
         ['info','11:04:31','Queue empty.']]
  },
  'processing': {
    conn:['connected','Premiere is taking commands'],
    srv:['connected','Premiere is busy with the command'],
    host:HOST + ' · ' + PROJ,
    beat:'Heartbeat 0.1 s ago · beats while busy',
    rail:'open', running:true, open:true,
    cmd:'bake_keyframe_ease', id:'cmd_1f4a3c9e', elapsed:37600, watchdog:WATCHDOG,
    queue:[['export_sequence', 6300], ['set_clip_scale', 1100]],
    trip:['apply_lumetri_preset', 144],
    dir:DIR,
    auth:'Per-session token enforced. Rejected 0.',
    log:[['info','11:07:52','bake_keyframe_ease started. Limit 45 s.'],
         ['warning','11:08:00','Server stopped waiting at 8 s. It is polling for the result.'],
         ['info','11:08:00','Queued: export_sequence, set_clip_scale.']]
  },
  'error': {
    conn:['connected','Premiere is taking commands'],
    srv:['connected','Premiere answered in 58 ms · 1.4 f'],
    host:HOST + ' · ' + PROJ,
    beat:'Heartbeat 0.3 s ago · fresh under 4 s',
    rail:'open', running:false, open:true,
    idleNote:'Nothing is running. The next command gets 45 s.',
    broke:{
      kind:'punch',
      what:'export_sequence ran past its 45 s limit, so the panel killed it.',
      fix:'Premiere never returned a result. Close any export or Save As dialog in Premiere, then send the command again.',
      stamp:'11:12:37 · cmd_9b02e441 · died at +00:00:45:00'
    },

/* ── perforation rails ────────────────────────────────────────────────── */
function fillRail(el, n){
  var h = '';
  for (var i = 0; i < n; i++) h += '<div class="perf"></div>';
  el.innerHTML = h;
}

/* ── the frame ruler: one tick per second of the watchdog, grouped in fives
      like a footage counter, and punched at the deadline. Drawn at its true
      value on the first paint — the data never animates in.               */
function drawRuler(elapsed, watchdog, live){
  var t = document.getElementById('ticks');
  var total = Math.round(watchdog / 1000);
  var done  = live ? Math.floor(elapsed / 1000) : 0;
  var h = '';
  for (var i = 1; i <= total; i++)
    h += '<div class="tick' + (i % 5 === 0 ? ' sec' : '') + (i <= done ? ' on' : '') + '"></div>';
  h += '<div class="tick kill" title="The panel kills the command here"></div>';
  t.innerHTML = h;
}

function render(name){
  var s = STATES[name] || STATES['disconnected'];
  var $ = function(id){ return document.getElementById(id); };

  /* channel */
  $('connectionStatus').className = s.conn[0];
  $('connectionText').textContent = s.conn[1];
  $('serverStatus').className = s.srv[0];
  $('serverText').textContent = s.srv[1];
  $('hostLine').textContent = s.host;
  $('beatLine').textContent = s.beat;

  var connected = !!s.open || !!s.starting;
  $('startButton').disabled = connected;
  $('stopButton').disabled = !connected;

  /* rails */
  var rc = 'rail ' + (s.rail === 'open' ? 'open' : s.rail === 'arming' ? 'arming' : 'closed');
  $('railL').className = rc + ' rail-l';
  $('railT').className = rc + ' rail-h rail-t';
  $('railB').className = rc + ' rail-h rail-b';

  /* the count — UNKNOWN is an em-dash, never a zero */
  var num = $('numeral'), sweep = $('sweep'), idle = $('idleRing'), scribe = $('scribe');
  var C = 276.5;
  if (s.running){
    var wd = s.watchdog || WATCHDOG;
    var left = Math.max(0, wd - s.elapsed);
    var secs = Math.ceil(left / 1000);
    num.textContent = secs;
    num.className = 'num mono' + (secs <= 3 ? ' last' : secs <= 8 ? ' leader' : '');
    scribe.className = 'scribe' + (secs <= 3 ? ' last' : '');
    idle.style.display = 'none';
    sweep.style.display = '';
    /* True value on the first paint. The one animated moment in this panel is
       this arc closing as the real countdown advances, once per second — see
       the CSS transition on .sweep. It runs only while a command is in flight
       and it is switched off entirely under prefers-reduced-motion. */
    sweep.setAttribute('stroke-dashoffset', C * (left / wd));
    $('deadlineLine').textContent = 'Killed in ' + secs + ' s if it does not return';
    $('cmdLine').innerHTML = s.cmd + '<span class="cmdid">' + s.id + '</span>';
    $('budgetLine').textContent = s.elapsed > BUDGET
      ? 'Past the server’s 8 s budget, so it is polling for the result.'
      : 'Inside the server’s 8 s budget.';
    $('elapsedTc').innerHTML = '<b>' + tc(s.elapsed) + '</b> · ' + fstr(s.elapsed);
    $('killTc').textContent = tc(wd) + ' kill';
    $('ruler').style.display = '';
    drawRuler(s.elapsed, wd, true);
  } else {
    num.textContent = '—';
    num.className = 'num wait mono';
    scribe.className = 'scribe';
    idle.style.display = '';
    sweep.style.display = 'none';
    $('deadlineLine').textContent = 'No command running';
    $('cmdLine').innerHTML = '<span class="cmdid">— no command id</span>';
    $('budgetLine').textContent = s.idleNote;
    if (s.open){
      $('ruler').style.display = '';
      $('elapsedTc').innerHTML = '<b>—</b>';
      $('killTc').textContent = tc(WATCHDOG) + ' kill';
      drawRuler(0, WATCHDOG, false);
    } else {
      $('ruler').style.display = 'none';
    }
  }

  /* what broke */
  $('countFrame').className = 'frame' + (s.broke && !s.running ? ' dim' : '');
  var bf = $('brokeFrame');
  if (s.broke){
    bf.style.display = '';
    $('brokeEdge').textContent = s.broke.kind === 'punch' ? 'What broke' : 'What to fix';
    $('brokeBox').className = 'broke' + (s.broke.kind === 'punch' ? '' : ' notice');
    $('brokeWhat').textContent = s.broke.what;
    $('brokeFix').textContent  = s.broke.fix;
    $('brokeStamp').textContent = s.broke.stamp;
  } else bf.style.display = 'none';

  /* queue */
  var q = $('commandQueue'), h = '';
  if (s.queue === null){
    h = '<div class="q none"><span class="qn">' + (s.qnull || '— bridge stopped') + '</span></div>';
  } else if (s.queue.length === 0){
    h = '<div class="q none"><span class="qn">Nothing queued</span></div>';
  } else {
    for (var i = 0; i < s.queue.length; i++){
      h += '<div class="q"><span class="qn">' + s.queue[i][0] + '</span>' +
           '<span class="qa">held ' + dur(s.queue[i][1]) + '</span></div>';
    }
  }
  q.innerHTML = h;
  $('lastTrip').innerHTML = s.trip
    ? '<div class="q"><span class="qn"><span class="pop"></span>' + s.trip[0] +
      '</span><span class="qa">back ' + msstr(s.trip[1]) + '</span></div>'
    : '<div class="q none"><span class="qn">Nothing has come back yet</span></div>';

  /* folder + auth */
  $('tempDirectory').value = s.dir;
  $('authLine').textContent = s.auth;

  /* log */
  var L = '';
  for (var j = 0; j < s.log.length; j++){
    L += '<div class="log-entry ' + s.log[j][0] + '"><span class="t">' + s.log[j][1] +
         '</span><span class="m">' + s.log[j][2] + '</span></div>';
  }
  $('logContainer').innerHTML = L;

  /* switcher pressed-state */
  var b = document.querySelectorAll('#stateBtns button');
  for (var k = 0; k < b.length; k++) b[k].setAttribute('aria-pressed', b[k].dataset.s === name ? 'true' : 'false');
  CURRENT = name;
}

/* ── theme: Premiere has four user brightness levels ──────────────────── */
var LEVELS = ['t-darkest','t-dark','t-light','t-lightest'];
function setTheme(cls){
  document.body.className = cls;
  var b = document.querySelectorAll('#themeBtns button');
  for (var i = 0; i < b.length; i++) b[i].setAttribute('aria-pressed', b[i].dataset.t === cls ? 'true' : 'false');
}
/* Real host adaptation: take Premiere's own surface colour and typeface. */
function adoptHost(){
  try {
    if (typeof CSInterface === 'undefined') return;
    var skin = new CSInterface().hostEnvironment.appSkinInfo;
    var c = skin.panelBackgroundColor.color;
    var r = Math.round(c.red), g = Math.round(c.green), bl = Math.round(c.blue);
    var lum = (0.2126 * r + 0.7152 * g + 0.0722 * bl) / 255;
    document.body.className = lum > 0.62 ? 't-lightest' : lum > 0.42 ? 't-light'
                            : lum > 0.16 ? 't-dark' : 't-darkest';
    document.documentElement.style.setProperty('--base', 'rgb(' + r + ',' + g + ',' + bl + ')');
    if (skin.baseFontFamily)
      document.documentElement.style.setProperty('--f-ui', skin.baseFontFamily + ',"Adobe Clean",sans-serif');
  } catch (e) {}
}

/* ── boot ─────────────────────────────────────────────────────────────── */
var CURRENT = 'disconnected';
var ORDER = ['disconnected','starting','connected-idle','processing','error','premiere-not-ready','temp-dir-unset'];
var SHORT = {'disconnected':'stopped','starting':'starting','connected-idle':'idle','processing':'running','error':'error','premiere-not-ready':'no project','temp-dir-unset':'no folder'};

(function boot(){
  fillRail(document.getElementById('railL'), 60);
  fillRail(document.getElementById('railT'), 90);
  fillRail(document.getElementById('railB'), 90);

  var sb = document.getElementById('stateBtns'), h = '';
  for (var i = 0; i < ORDER.length; i++)
    h += '<button data-s="' + ORDER[i] + '" title="' + ORDER[i] + '">' + SHORT[ORDER[i]] + '</button>';
  sb.innerHTML = h;
  var bs = sb.querySelectorAll('button');
  for (var j = 0; j < bs.length; j++)
    bs[j].onclick = function(){ render(this.dataset.s); };

  var tb = document.getElementById('themeBtns'), t = '';
  for (var k = 0; k < LEVELS.length; k++)
    t += '<button data-t="' + LEVELS[k] + '">' + (k + 1) + '</button>';
  tb.innerHTML = t;
  var ts = tb.querySelectorAll('button');
  for (var m = 0; m < ts.length; m++)
    ts[m].onclick = function(){ setTheme(this.dataset.t); };

  var p = location.search.match(/state=([a-z\-]+)/);
  var q = location.search.match(/theme=(t-[a-z]+)/);
  setTheme(q ? q[1] : 't-darkest');
  render(p && STATES[p[1]] ? p[1] : 'connected-idle');
  adoptHost();
})();

/* live-code entry points; the real bridge-cep.js replaces these */
function startBridge(){ render('starting'); }
function stopBridge(){ render('disconnected'); }
function saveConfig(){ render('connected-idle'); }
function runDiagnostics(){ render(CURRENT); }
function clearLog(){ document.getElementById('logContainer').innerHTML = ''; }
</script>
