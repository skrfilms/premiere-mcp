name: Upload CEP release asset

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  cep-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build and verify npm package
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand --silent
      - run: npm run pack:check
      - run: npm run bundle:mcpb

      - name: Build unsigned CEP archive
        run: |
          cd cep-plugin
          zip -r "../MCPBridgeCEP-${{ github.event.release.tag_name }}-unsigned.zip" . -x "_design/*"

      - name: Upload CEP archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "MCPBridgeCEP-${{ github.event.release.tag_name }}-unsigned.zip" --clobber
          # A bundle uploaded by hand was built with the signed plugins (the certificate is not in
          # CI); keep it rather than replacing it with this unsigned-plugin build.
          if gh release view "${{ github.event.release.tag_name }}" --json assets -q '.assets[].name' | grep -q '\.mcpb$'; then
            echo "Release already has an .mcpb; leaving it."
          else
            gh release upload "${{ github.event.release.tag_name }}" release-artifacts/premiere-mcp-*.mcpb
          fi
